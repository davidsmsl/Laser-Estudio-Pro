<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; script-src 'self'">
  <title>Láser Estudio Pro</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app">
    <header id="toolbar"></header>
    <div id="numbar"></div>
    <div id="main">
      <aside id="toolbox"></aside>
      <div id="stage">
        <canvas id="cv" tabindex="0"></canvas>
        <div id="previewbar" hidden></div>
      </div>
      <aside id="side">
        <nav id="tabs"></nav>
        <div id="panels"></div>
      </aside>
    </div>
    <footer id="palette"></footer>
    <div id="statusbar"><span id="st-pos"></span><span id="st-msg"></span><span id="st-machine"></span></div>
  </div>
  <div id="modal" hidden></div>
  <div id="toast"></div>
  <button id="stopAll" hidden title="Detener todo: trabajo, marco, ensayo, giro de prueba o movimiento (Ctrl+Espacio o tecla Pausa)">■ DETENER</button>

  <script src="../node_modules/opentype.js/dist/opentype.js"></script>
  <script src="../node_modules/clipper-lib/clipper.js"></script>
  <script src="../node_modules/dxf-parser/dist/dxf-parser.js"></script>
  <script src="../node_modules/imagetracerjs/imagetracer_v1.2.6.js"></script>
  <script src="js/i18n-dict.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/geom.js"></script>
  <script src="js/doc.js"></script>
  <script src="js/raster.js"></script>
  <script src="js/canvas.js"></script>
  <script src="js/importers.js"></script>
  <script src="js/ops.js"></script>
  <script src="js/jobs.js"></script>
  <script src="js/gcode.js"></script>
  <script src="js/ruida.js"></script>
  <script src="js/machine.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/dialogs.js"></script>
  <script src="js/rotsim.js"></script>
  <script src="js/fondo.js"></script>
  <script src="js/materials.js"></script>
  <script src="js/imagewizard.js"></script>
  <script src="js/app.js"></script>
  <script type="module" src="js/vista3d.mjs"></script>
  <script type="module" src="js/firmware.mjs"></script>
</body>
</html>
